spring.application.name=gastos-fianceiros

# Configuração de conexão com o banco de dados
# O uso de '${VAR:default}' impede que a aplicação quebre se a variável não estiver no ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurações de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O dialeto MySQLDialect genérico funciona bem para MySQL 8+. 
# Se estiver em versões muito antigas, o MySQL5Dialect é preferível.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway desligado conforme sua preferência
spring.flyway.enabled=false

api.security.token.secret=${JWT_SECRET:4Q5oVayteSxCuqmXZEfEeKjiRRL6MYX2}